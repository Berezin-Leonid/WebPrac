<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Должности</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        .indent {
            margin-left: 30px;
            margin-right: 30px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div th:replace="~{general :: page-header}"> </div>

<div class="indent">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Список сотрудников</h4>
        <a href="/employee/add" class="btn btn-success">
            ➕ Добавить должность
        </a>
    </div>
    <table class="table table-bordered table-warning">
        <thead class="thead-dark">
        <tr>
            <th scope="col"> Название </th>
            <th scope="col"> Обязаности </th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${posts.isEmpty()}">
            <td colspan="6"> В базе пока нет ни одной должности. <a href="/employee/add">Добавить?</a></td>
        </tr>
        <tr th:each="post : ${posts}">
            <td>
                    <span th:text="${post.getName()}"> </span>
                </a>
            </td>
            <td>
                <span th:text="${post.getRespons()}"></span>
            </td>

        </tr>

        </tbody>
    </table>
</div>

<div th:replace="general :: site-script"></div>

</body>
</html>
