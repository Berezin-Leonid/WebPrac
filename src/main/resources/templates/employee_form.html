<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <th:block th:replace="~{general :: head}"></th:block>
    <title>Добавить сотрудника</title>
</head>
<body>

<nav th:replace="~{general :: nav}"></nav>

<div class="container mt-4">
    <h2>Добавить сотрудника</h2>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="mt-3">

        <div class="mb-3">
            <label for="name" class="form-label">Имя</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>

        <div class="mb-3">
            <label for="birthDay" class="form-label">Дата рождения</label>
            <input type="date" th:field="*{birthDay}" class="form-control" id="birthDay">
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="/employees" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
