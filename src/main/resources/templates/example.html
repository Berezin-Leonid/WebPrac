<!-- templates/readers/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{common :: head}"></th:block>
<body>
<nav th:replace="~{common :: nav}"></nav>

<div class="container">
    <h2>List of readers</h2>

    <!-- Форма поиска -->
    <form method="get" class="mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text"
                       class="form-control"
                       name="fullName"
                       placeholder="Search by FIO"
                       th:value="${param.fullName}">
            </div>
            <div class="col-md-3">
                <input type="text"
                       class="form-control"
                       name="cardNumber"
                       placeholder="Number of read ticket"
                       th:value="${param.cardNumber}">
            </div>
            <div class="col-md-3">
                <input type="text"
                       class="form-control"
                       name="address"
                       placeholder="email"
                       th:value="${param.address}">
            </div>
            <div class="col-md-3">
                <input type="text"
                       class="form-control"
                       name="phoneNumber"
                       placeholder="telephon number"
                       th:value="${param.phoneNumber}">
            </div>
            <div class="col-md-1">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
            <div class="col-md-2">
                <a href="/readers/new" class="btn btn-success w-100">
                    <i class="bi bi-plus"></i> Registration of new user
                </a>
            </div>
        </div>
    </form>

    <!-- Таблица читателей -->
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>=FIO</th>
                <th>number</th>
                <th>address</th>
                <th>telephon</th>
                <th>Number of books in hand</th>
                <th>moves</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(readers)}">
                <td colspan="6" class="text-center">No found</td>
            </tr>
            <tr th:each="reader : ${readers}">
                <td th:text="${reader.fullName}">ФИО</td>
                <td th:text="${reader.libraryCardNum}">Номер билета</td>
                <td th:text="${reader.address ?: '-'}">Адрес</td>
                <td th:text="${reader.phoneNumber ?: '-'}">Телефон</td>
                <td th:text="${borrowingsCount[reader.id]}">0</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/readers/{id}(id=${reader.id})}"
                           class="btn btn-sm btn-info">
                            Подробнее
                        </a>
                        <a th:href="@{/borrowings/borrow(readerCardNum=${reader.libraryCardNum})}" class="btn btn-sm btn-success">
                            Выдать книгу
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{common :: scripts}"></div>
</body>
</html>
